[package]
name = "hygiea-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Examples for hygiea"
publish = false

# 错误码的项目前缀，本 crate 里所有 #[derive(hy_err)] 共用
[package.metadata.hygiea]
err_code_project_prefix = "001"

[dev-dependencies]
# db-sqlx-sqlite / http-axum：app 示例用的现成组件，SQLite 用内存库，不需要装数据库服务；
# full 带上 log、datetime-iana、redact 等 core feature；HTTP 客户端另开组件 feature
hygiea = { workspace = true, features = ["full", "db-sqlx-sqlite", "http-axum", "http-client-reqwest"] }
# app_basic / http_client_basic / http_axum_response 写 HTTP 路由用
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# redact_basic 对比普通序列化
serde_json = { workspace = true }
# datetime_basic 里给 UtcDateTime / OffsetDateTime 命名类型（hygiea 只扩展方法，不重导出这两个类型）
time = { workspace = true }

# 示例按主题分目录，Cargo 只自动发现 examples/*.rs 和 examples/*/main.rs，所以逐个声明
[[example]]
name = "app_basic"
path = "examples/app/basic.rs"

[[example]]
name = "app_dependencies"
path = "examples/app/dependencies.rs"

[[example]]
name = "app_named_instances"
path = "examples/app/named_instances.rs"

[[example]]
name = "app_global_state"
path = "examples/app/global_state.rs"

[[example]]
name = "app_background_task"
path = "examples/app/background_task.rs"

[[example]]
name = "app_config"
path = "examples/app/config.rs"

[[example]]
name = "error_basic"
path = "examples/error/basic.rs"

[[example]]
name = "string_template"
path = "examples/string/template.rs"

[[example]]
name = "log_basic"
path = "examples/log/basic.rs"

[[example]]
name = "datetime_basic"
path = "examples/datetime/basic.rs"

[[example]]
name = "env_basic"
path = "examples/env/basic.rs"

[[example]]
name = "redact_basic"
path = "examples/redact/basic.rs"

[[example]]
name = "http_client_basic"
path = "examples/http_client/basic.rs"

[[example]]
name = "http_axum_response"
path = "examples/http/axum_response.rs"
