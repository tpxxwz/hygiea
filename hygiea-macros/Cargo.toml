[package]
name = "hygiea-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural macros for hygiea error handling"

[lib]
proc-macro = true

[features]
default = []
# #[redact] 属性宏，不常用，开了才编译
redact = []
# #[component] 属性宏，app 用，开了 app 才编译
component = []

[dependencies]
quote.workspace = true
syn.workspace = true
proc-macro2.workspace = true
# 编译期解析 err_tpl：校验语法、判断有没有模板变量
minijinja.workspace = true
# 编译期读调用方 Cargo.toml 里的 [package/workspace.metadata.hygiea]
toml.workspace = true
# 找调用方实际依赖的 hygiea / hygiea-core 叫什么名字，生成代码里的路径跟着它
proc-macro-crate.workspace = true

[dev-dependencies]
# 宏的编译期检查（trybuild）：fixture 通过 facade 使用宏，和下游的实际写法一样（生成 ::hygiea:: 路径）。
# facade 间接依赖本 crate，dev-dependency 形成的循环 Cargo 允许。
# 只写 path 不写版本：facade 比本 crate 晚发布，带版本号的话 cargo publish 解析的是 crates.io 上的旧版 facade
# （新 feature 不存在就直接失败）；没有版本号的 dev-dependency 打包时会被自动去掉
hygiea = { path = "../hygiea", features = ["redact", "app"] }
trybuild = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# #[component] 的 fixture：启动方法的签名里要写 tokio::task::JoinHandle
tokio = { workspace = true }
