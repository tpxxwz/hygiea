# cargo-nextest 的配置。每个测试单独一个进程，测试二进制之间也并行。安装：cargo install cargo-nextest --locked
#
# 平时全量跑（默认、container 层；container 层要 Docker）：
#   cargo nextest run --workspace --all-features --run-ignored all
# container 层的测试被 #[container] 标成了 #[ignore]，cargo test 和 nextest 默认都不跑；--run-ignored all 连同普通测试
# 一起跑（配置文件里写不了这一项，只能写在命令行上）。
# nextest 不跑 doc test，要跑用 cargo test --workspace --all-features --doc

[profile.default]
# 默认不跑的：
# - trybuild 的编译期报错测试（测试二进制名以 _ui 结尾），改了宏时再跑：
#   cargo nextest run --workspace --all-features --ignore-default-filter -E 'binary(/_ui$/)'
# - live 层：用真实凭证连真实的托管服务（R2、AWS 等），会产生费用、改动真实数据。
#   agent 绝对不能跑：不要用 --ignore-default-filter 或 -E 把 ::live:: 的测试选进来。只由用户自己手动跑，
#   要跑的命令写在各测试文件的文件头里
default-filter = "not binary(/_ui$/) and not test(/::live::/)"
