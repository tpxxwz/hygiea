# 异常响应的单接口用例

# 慢响应：测 client 的超时
[[interactions]]
name = "慢"
request = { method = "GET", path = "/api/items", query_param = { slow = "1" } }
delay_ms = 300
response = { json = { items = [], total = 0 } }

# 灰度：match_script 判断 x-beta 头，返回新格式
[[interactions]]
name = "灰度"
request = { method = "GET", path = "/api/items" }
match_script = "is_beta.rhai"
response = { json = { items = [], total = 0, next_cursor = "c1" } }

# 网关返回 HTML
[[interactions]]
name = "网关错误"
request = { method = "GET", path = "/api/items" }
response = { status = 200, headers = { content-type = "text/html" }, body = "<html>502 Bad Gateway</html>" }
