[package]
name = "hygiea"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A comprehensive Rust toolkit with error handling, template rendering, application framework, and more"
keywords = ["error", "utility", "std", "toolkit"]
categories = ["development-tools"]
# crates.io 页面显示的 README：用仓库根目录那份，打包时 cargo 会把它复制进包里
readme = "../README.md"

[dependencies]
hygiea-core = { workspace = true }
# 组件 crate，按下面的 feature 引入
hygiea-db = { workspace = true, optional = true }
hygiea-redis = { workspace = true, optional = true }
hygiea-http = { workspace = true, optional = true }
hygiea-http-client = { workspace = true, optional = true }
hygiea-grpc = { workspace = true, optional = true }
hygiea-aws = { workspace = true, optional = true }

[features]
default = []  # 用户明确选择需要的功能

# ---- core 的功能：一对一转发，feature 之间的依赖关系只在 core 里写 ----
app = ["hygiea-core/app"]
log = ["hygiea-core/log"]
ws-client = ["hygiea-core/ws-client"]
redact = ["hygiea-core/redact"]
# 动态配置的 #[derive(Live)]，单开没用，经 db-live-config 打开
live-config = ["hygiea-core/live-config"]
lock = ["hygiea-core/lock"]
lock-tokio = ["hygiea-core/lock-tokio"]
json = ["hygiea-core/json"]
datetime-iana = ["hygiea-core/datetime-iana"]
datetime-chrono = ["hygiea-core/datetime-chrono"]
full = ["hygiea-core/full"]

# ---- 组件：hygiea::db / redis / http / grpc / aws。组件 crate 自己依赖 core 的 app ----
# db：框架、数据库、功能三个维度各自独立、只增加功能，一对一转发给 hygiea-db，同时打开的组合才有东西：
# db-sqlx + db-postgres 得到 SqlxPgComponent，再加 db-lock 它就实现了分布式锁。支持哪些组合见 README
db-sqlx = ["dep:hygiea-db", "hygiea-db/sqlx"]
db-seaorm = ["dep:hygiea-db", "hygiea-db/seaorm"]
db-postgres = ["dep:hygiea-db", "hygiea-db/postgres"]
db-sqlite = ["dep:hygiea-db", "hygiea-db/sqlite"]
db-mysql = ["dep:hygiea-db", "hygiea-db/mysql"]
# 连接池的数据库配置表（动态配置）
db-live-config = ["live-config", "dep:hygiea-db", "hygiea-db/live-config"]
# 连接池的分布式锁：PG 整数 key 用 advisory lock；字符串 key 要开 db-lock-row（锁表，精确），不开时返回
# LockErr::Unsupported，要哈希的由调用方自己 LockKeyI64::xxh3_64(&key) 后调 try_lock_i64。
# MySQL 的整数 key、字符串 key 都用 GET_LOCK（原生命名锁，不建表），db-lock-row 对它没有影响
db-lock = ["lock", "dep:hygiea-db", "hygiea-db/lock"]
db-lock-row = ["db-lock", "hygiea-db/lock-row"]
redis-fred = ["dep:hygiea-redis", "hygiea-redis/fred"]
http-axum = ["dep:hygiea-http", "hygiea-http/axum"]
http-client-reqwest = ["dep:hygiea-http-client", "hygiea-http-client/reqwest"]
# ReqwestConfig::debug：日志带原文和请求头、响应头，只在 dev-dependencies 里开
http-client-reqwest-debug-log = ["http-client-reqwest", "hygiea-http-client/debug-log"]
grpc-tonic = ["dep:hygiea-grpc", "hygiea-grpc/tonic"]
aws-s3 = ["dep:hygiea-aws", "hygiea-aws/s3"]
