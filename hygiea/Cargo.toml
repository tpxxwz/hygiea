[package]
name = "hygiea"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A comprehensive Rust toolkit with error handling, template rendering, application framework, and more"
keywords = ["error", "utility", "std", "toolkit"]
categories = ["development-tools"]

[dependencies]
# 内部依赖
hygiea-core = { path = "../hygiea-core", default-features = false }
hygiea-macros = { path = "../hygiea-macros" }

# 宏生成的代码需要这些依赖
serde_json = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }

# 可选依赖
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[features]
default = []  # 用户明确选择需要的功能

# 功能模块（传递给 core）
template = ["hygiea-core/template", "dep:serde_json"]          # 模板渲染工具
error = ["hygiea-core/error", "dep:serde_json", "dep:linkme"]  # 错误处理模块
app = ["hygiea-core/app", "dep:tokio", "dep:async-trait"]      # 应用框架模块（当前已实现）
string = ["hygiea-core/string"]                                # 字符串工具（预留）
http = ["hygiea-core/http"]                                    # HTTP 工具（预留）
json = ["hygiea-core/json"]                                    # JSON 工具（预留）
time = ["hygiea-core/time"]                                    # 时间工具（预留）

# 全功能
full = ["template", "error", "app", "string", "http", "json", "time"]

[dev-dependencies]
trybuild.workspace = true
