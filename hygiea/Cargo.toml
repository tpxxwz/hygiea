[package]
name = "hygiea"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A comprehensive Rust toolkit with error handling, template rendering, application framework, and more"
keywords = ["error", "utility", "std", "toolkit"]
categories = ["development-tools"]

[dependencies]
hygiea-core = { workspace = true }
serde_json = { workspace = true }


[dev-dependencies]
# #[redact] 的编译期报错回归测试：宏生成 ::hygiea:: 路径，放在 facade 里测就是下游实际的用法
trybuild = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[features]
default = []  # 用户明确选择需要的功能

# 功能模块（传递给 core）
app = ["log", "hygiea-core/app"]            # 应用框架模块（当前已实现）
log = ["datetime-iana", "hygiea-core/log"]      # 日志配置和初始化，可脱离 app 单独用
http = ["hygiea-core/http"]                                    # HTTP 工具
distributed-lock = ["hygiea-core/distributed-lock"]
json = ["hygiea-core/json"]                                    # JSON 工具（预留）
ws = ["hygiea-core/ws"]

# chrono 互转桥（DateTimeUtcExt）
datetime-chrono = ["hygiea-core/datetime-chrono"]
datetime-iana = ["hygiea-core/datetime-iana"]

# 全功能
full = ["app", "log", "http", "json", "ws", "distributed-lock", "datetime-chrono", "datetime-iana"]
