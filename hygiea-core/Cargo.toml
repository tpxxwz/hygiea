[package]
name = "hygiea-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core implementation for hygiea"

[lib]
crate-type = ["rlib"]

[features]
default = []

# Template rendering helpers
template = ["dep:minijinja", "dep:parking_lot", "dep:serde_json", "dep:lru"]

# Error handling module
error = ["dep:minijinja", "dep:parking_lot", "dep:serde_json", "dep:linkme", "dep:ctor"]

# Application framework module
app = ["dep:tokio", "dep:async-trait", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-log", "dep:tracing-appender", "dep:serde", "dep:dashmap"]

# Distributed lock abstractions
distributed-lock = ["dep:async-trait"]

# Future modules (placeholder)
string = []
http = []
json = []
time = []

# All features
full = ["template", "error", "app", "string", "http", "json", "time"]

[dependencies]
# Optional dependencies for template feature
minijinja = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
lru = { workspace = true, optional = true }

# Optional dependencies for error feature
linkme = { workspace = true, optional = true }
ctor = { workspace = true, optional = true }

# Optional dependencies for app feature
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-log = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
