[package]
name = "hygiea-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core implementation for hygiea"

[lib]
crate-type = ["rlib"]

# 错误码的项目前缀：BaseErr 等 core 自带的错误都是 999 开头
[package.metadata.hygiea]
err_code_project_prefix = "999"

[features]
default = []


# Application framework module
app = ["log", "dep:async-trait", "dep:dashmap", "dep:clap", "dep:config", "dep:tokio", "tokio/rt", "tokio/sync", "tokio/macros", "tokio/signal"]

# 日志配置和初始化，可脱离 app 单独用
log = ["datetime-iana", "dep:anyhow", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-log", "dep:tracing-appender", "serde/derive"]

# Distributed lock abstractions
distributed-lock = ["dep:async-trait"]

# chrono 互转桥（DateTimeUtcExt）；默认全 time，不需要 chrono 可不启用
datetime-chrono = ["dep:chrono"]

# Simulation clock; enables replacing the UTC clock source
# SimClock 推进 tokio 的虚拟时间，要 test-util
datetime-sim-clock = ["dep:tokio", "tokio/rt", "tokio/time", "tokio/test-util"]

# IANA timezone and system-local datetime support
datetime-iana = ["dep:time-tz"]

http = ["dep:reqwest", "dep:bytes", "dep:encoding_rs", "dep:futures-util", "dep:tokio", "tokio/io-util", "dep:tracing"]
json = []
ws = ["dep:tokio-tungstenite"]

# All features
full = ["app", "log", "http", "json", "ws", "distributed-lock", "datetime-chrono", "datetime-sim-clock", "datetime-iana"]

[dependencies]
# Error handling (always on)
minijinja = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true }
# redact 模块常开；serde_json 本来就依赖它，不多编译东西。derive 由用到的 feature 自己打开
serde = { workspace = true }
linkme = { workspace = true }
ctor = { workspace = true }
hygiea-macros = { workspace = true }

# 字符串工具的正则和模板编译缓存；string 模块常开，本身很轻（regex、minijinja 本来就是常开依赖）
lru = { workspace = true }

# Optional dependencies for app feature
clap   = { workspace = true, optional = true }
config = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-log = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }

chrono = { workspace = true, optional = true }
time = { workspace = true }
time-tz = { workspace = true, optional = true }
regex = { workspace = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
# 各测试共用的工具：日志捕获、本地 HTTP 服务等
hygiea-test-support = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serial_test = { workspace = true }
