[package]
name = "test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Test helpers shared by hygiea crates, used only as a dev-dependency"
publish = false

# 不能依赖 hygiea-core：core 把本 crate 当 dev-dependency，反过来依赖会让测试构建里出现两份 core，
# 两边的类型对不上。需要 hygiea 类型的测试数据留在各 crate 自己的测试里
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
