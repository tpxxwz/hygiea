[package]
name = "hygiea-test-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Procedural macros for hygiea-test: #[container] / #[live] test tiers"

# 只经由 hygiea-test 使用：生成的代码调用 ::hygiea_test 里的函数

[lib]
proc-macro = true

[dependencies]
quote.workspace = true
syn.workspace = true
proc-macro2.workspace = true
# 找调用方实际依赖的 hygiea-test 叫什么名字，生成代码里的路径跟着它
proc-macro-crate.workspace = true

[dev-dependencies]
# fixture 经 hygiea-test 使用宏，和下游写法一样。
# 只写 path 不写版本：hygiea-test 比本 crate 晚发布，带版本号的话 cargo publish 解析不到它；
# 没有版本号的 dev-dependency 打包时会被自动去掉
hygiea-test = { path = "../hygiea-test" }
trybuild = { workspace = true }
