# AxumConfig（hygiea::http，feature http-axum）的配置模板
#
# 列出全部配置项：生效的值等于代码默认值，默认不启用的可选项写成注释。复制到自己项目的 config/<env>.toml，
# 删掉用不到的项、改需要改的值；只需要写和默认值不同的项。互斥的写法（二选一）都在这里，注释里写明了怎么切换。
# 段名 [http] 是应用配置结构体里这个字段的名字（`struct AppConfig { http: AxumConfig, .. }`），按自己的改。
# 通用规则（写错的配置项启动报错、配置来源的覆盖顺序、环境变量写法）见 hygiea 的 README「配置」。
#
# 本文件由所在 crate 的 src/axum_server.rs 的单元测试（template_is_code_defaults） 按 AxumConfig 解析校验，改了配置结构体要同步改这里。

[http]
# 监听地址和端口，0.0.0.0 表示所有网卡
host = "0.0.0.0"
port = 8080
# （当前版本未生效，保留字段）路由的统一前缀
base_path = ""
# 关闭时最多等多久（秒）让手上的请求处理完。不写用 registry.shutdown_timeout_secs；
# 有长请求（大文件上传、长轮询）就配长一点
# shutdown_timeout_secs = 30

# 超时默认不设；需要时取消注释表头和所需字段
# [http.timeout]
# 单个请求处理超过这么多秒，返回 408
# request_read_secs = 30
# 下面三项当前版本未生效（保留字段）
# connect_secs = 5
# header_read_secs = 5
# response_write_secs = 30

# 限制默认不设；需要时取消注释表头和所需字段
# [http.limits]
# 请求体最大字节数，超过返回 413
# max_body_size = 10485760
# 当前版本未生效（保留字段）
# max_header_size = 16384
