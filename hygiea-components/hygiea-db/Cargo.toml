[package]
name = "hygiea-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Database components for hygiea: connection pools for PostgreSQL and SQLite"

# 框架内置错误（HyDbErr）用项目前缀 999
[package.metadata.hygiea]
err_code_project_prefix = "999"

# 两个维度分开选：框架（sqlx / seaorm）和数据库（postgres / sqlite / mysql），
# 同时打开的组合才会编译，比如 ["sqlx", "postgres"] 得到 SqlxPgComponent。默认什么都不开
[features]
default = []
# ---- 框架 ----
sqlx = ["dep:sqlx"]
seaorm = ["dep:sea-orm", "dep:log"]
# ---- 功能 ----
# 连接池的数据库配置表（动态配置）能力，见 live_config 模块文档
live-config = ["dep:sqlx", "dep:serde_json", "tokio/time"]
# 连接池实现分布式锁（hygiea-core 的 DistributedLock），见 lock 模块文档
lock = ["dep:sqlx", "hygiea-core/lock"]
# PG 的字符串 key 用锁表实现（{app_name}_lock）
lock-table = ["lock"]
# ---- 数据库 ----
postgres = ["sqlx?/postgres"]
sqlite = ["sqlx?/sqlite"]
# 预留，还没有实现
mysql = []

[dependencies]
hygiea-core = { workspace = true, features = ["app"] }
sqlx = { workspace = true, features = ["time"], optional = true }
sea-orm = { workspace = true, features = ["with-time"], optional = true }
log = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
# #[container] 和启动容器。hygiea-test 只依赖 core，cargo publish --workspace 会把它排在组件前面发布，
# 所以可以带版本号
hygiea-test = { workspace = true, features = ["container"] }
# db! 的编译期检查（tests/db_macro_ui.rs）
trybuild = { workspace = true }

[package.metadata.docs.rs]
all-features = true
