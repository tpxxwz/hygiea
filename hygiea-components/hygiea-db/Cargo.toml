[package]
name = "hygiea-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Database components for hygiea: connection pools for PostgreSQL and SQLite"

# 框架内置错误（HyDbErr）用项目前缀 999
[package.metadata.hygiea]
err_code_project_prefix = "999"

# 三个维度分开选，各自独立、只增加功能（Cargo 的 feature 要能叠加），同时打开的组合才会编译：
# - 框架：sqlx / seaorm
# - 数据库：postgres / sqlite / mysql
# - 功能：live-config / lock / lock-row，不绑定驱动，实现按"功能 + 框架 + 数据库"的组合编译
# 比如 ["sqlx", "postgres"] 得到 SqlxPgComponent，再加 "lock" 它就实现了分布式锁。
# 组合条件集中在 build.rs 的 cfg 别名里。默认什么都不开
[features]
default = []
# ---- 框架 ----
sqlx = ["dep:sqlx"]
# SeaORM 底下就是 sqlx，锁、动态配置的内部实现直接用它，直接声明不增加实际依赖
seaorm = ["dep:sea-orm", "dep:sqlx", "dep:log"]
# 以后加别的框架（toasty、tokio-postgres、diesel-async ..）照 research/db-drivers 分支的写法
# ---- 数据库 ----
postgres = ["sqlx?/postgres"]
sqlite = ["sqlx?/sqlite", "sea-orm?/sqlx-sqlite"]
# MySQL 8.0+（sqlx、SeaORM 的连接池；锁用 GET_LOCK，动态配置只靠轮询）
mysql = ["sqlx?/mysql", "sea-orm?/sqlx-mysql"]
# ---- 功能 ----
# 连接池的数据库配置表（动态配置），见 live_config 模块文档；日志里的值按 #[redact] 打码，带上 core 的 redact；
# #[derive(hy_live_config)] 由 core 的 live-config 导出。
# 实现：sqlx / seaorm + postgres / mysql / sqlite
live-config = ["dep:serde_json", "tokio/time", "hygiea-core/redact", "hygiea-core/live-config"]
# 连接池实现分布式锁（hygiea-core 的 DistributedLock），见 lock 模块文档。实现：sqlx / seaorm + postgres / mysql
lock = ["hygiea-core/lock"]
# PG 的字符串 key 用锁表实现（{app_name}_lock，启动时建表），精确；不开时字符串 key 返回 LockErr::Unsupported，
# 要哈希的由调用方自己 LockKeyI64::xxh3_64(&key) 后调 try_lock_i64。MySQL 的字符串 key 用 GET_LOCK，和它无关
lock-row = ["lock"]

[dependencies]
hygiea-core = { workspace = true, features = ["app"] }
sqlx = { workspace = true, features = ["time"], optional = true }
sea-orm = { workspace = true, features = ["with-time"], optional = true }
log = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# 单元测试里解析 config/ 下的配置模板
toml = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
# #[container] 和启动容器。hygiea-test 只依赖 core，cargo publish --workspace 会把它排在组件前面发布，
# 所以可以带版本号
hygiea-test = { workspace = true, features = ["container"] }
# db! 的编译期检查（tests/db_macro_ui.rs）
trybuild = { workspace = true }
# 捕获日志（tests/sqlx_postgres.rs 的 live config 测试）
test-support = { workspace = true }

[package.metadata.docs.rs]
all-features = true
