[package]
name = "hygiea-http-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reqwest HTTP client and component for hygiea"

[package.metadata.hygiea]
err_code_project_prefix = "999"

[features]
default = []
reqwest = [
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:reqwest",
    "dep:bytes",
    "dep:encoding_rs",
    "dep:futures-util",
    "dep:tracing",
]
# debug 日志：ReqwestConfig::debug 打开后日志带原文和请求头、响应头，只给测试用
debug-log = ["reqwest"]

[dependencies]
hygiea-core = { workspace = true, features = ["app", "redact"] }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "io-util"], optional = true }
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
test-support = { workspace = true }
# tcp::silent：建连卡住的本地地址，测 connect_timeout
hygiea-test = { workspace = true, features = ["tcp"] }
toml = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }

[[test]]
name = "reqwest_client"
path = "tests/reqwest_client/main.rs"
required-features = ["reqwest"]

[[test]]
name = "component"
path = "tests/component.rs"
required-features = ["reqwest"]

[package.metadata.docs.rs]
all-features = true
