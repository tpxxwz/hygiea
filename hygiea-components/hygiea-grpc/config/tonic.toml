# TonicConfig（hygiea::grpc，feature grpc-tonic）的配置模板
#
# 列出全部配置项：生效的值等于代码默认值，默认不启用的可选项写成注释。复制到自己项目的 config/<env>.toml，
# 删掉用不到的项、改需要改的值；只需要写和默认值不同的项。互斥的写法（二选一）都在这里，注释里写明了怎么切换。
# 段名 [grpc] 是应用配置结构体里这个字段的名字（`struct AppConfig { grpc: TonicConfig, .. }`），按自己的改。
# 通用规则（写错的配置项启动报错、配置来源的覆盖顺序、环境变量写法）见 hygiea 的 README「配置」。
#
# 本文件由所在 crate 的 src/tonic_server.rs 的单元测试（template_is_code_defaults） 按 TonicConfig 解析校验，改了配置结构体要同步改这里。

[grpc]
# 监听地址
addr = "0.0.0.0:50051"
# 关闭时最多等多久（秒）让手上的请求处理完，不写用 registry.shutdown_timeout_secs
# shutdown_timeout_secs = 30
