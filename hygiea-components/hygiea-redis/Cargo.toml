[package]
name = "hygiea-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Redis component for hygiea: connection pool and distributed lock"

# 选客户端实现：目前只有 fred。默认什么都不开
[features]
default = []
fred = ["dep:fred"]

[dependencies]
hygiea-core = { workspace = true, features = ["app"] }
fred = { version = "10.1", features = ["sentinel-auth"], optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
# #[container] 和启动容器。hygiea-test 只依赖 core，cargo publish --workspace 会把它排在组件前面发布，
# 所以可以带版本号
hygiea-test = { workspace = true, features = ["container"] }

[package.metadata.docs.rs]
all-features = true
